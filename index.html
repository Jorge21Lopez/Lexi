<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F766E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lexi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Lexi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#16213A; --muted:#5D6882; --line:#D5DBE5;
  --primary:#0F766E; --primary-ink:#FFFFFF; --primary-soft:#D7EFEB;
  --slot:#E9A21C; --ok:#0F766E; --ok-bg:#D7EFEB; --near:#9A6700; --near-bg:#FBEFD2;
  --bad:#C2410C; --bad-bg:#FCE4D6;
  --font:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1628; --surface:#172238; --ink:#E8EDF6; --muted:#9BA7C0; --line:#28354F;
    --primary:#2BB3A5; --primary-ink:#04211E; --primary-soft:#12393A;
    --slot:#F2B23A; --ok:#3CC7B8; --ok-bg:#113634; --near:#F2C14E; --near-bg:#3A3016;
    --bad:#FF8F5E; --bad-bg:#3D2218;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--slot);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

#app{max-width:560px;margin:0 auto;padding:20px 18px 110px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand i{font-style:normal;display:inline-block;width:18px;height:4px;background:var(--slot);border-radius:2px;margin-left:3px;vertical-align:baseline}
.muted{color:var(--muted)}
.small{font-size:14px}
h1{font-size:34px;line-height:1.1;letter-spacing:-.03em;margin:0 0 10px;font-weight:800}
h2{font-size:22px;line-height:1.2;letter-spacing:-.02em;margin:28px 0 12px;font-weight:700}
h3{font-size:18px;margin:0 0 6px;font-weight:700}
p{margin:0 0 12px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-bottom:12px}
.panel.note{border-left:5px solid var(--slot)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spread{justify-content:space-between}
.stack>*+*{margin-top:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;text-decoration:none}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.block{width:100%}
.btn.big{min-height:62px;font-size:19px;border-radius:18px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);min-height:42px;padding:0 10px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:18px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0 22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.stat b{display:block;font-size:26px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:13px;color:var(--muted)}

/* Sesión */
.sess-top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>div{height:100%;background:var(--primary);border-radius:4px;transition:width .3s}
.kind{font-size:15px;font-weight:600;color:var(--muted);margin-bottom:10px;display:flex;justify-content:space-between;gap:8px}
.chip{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--primary-soft);color:var(--primary)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px 22px;margin-bottom:18px}
.sentence{font-size:25px;line-height:1.45;font-weight:500;letter-spacing:-.01em;margin:0}
.slot{display:inline-block;min-width:88px;border-bottom:5px solid var(--slot);line-height:1.1;padding:0 4px;text-align:center;font-weight:700}
.slot.ok{color:var(--ok);border-color:var(--ok)}
.slot.bad{color:var(--bad);border-color:var(--bad)}
.slot.near{color:var(--near);border-color:var(--near)}
.base{display:inline-block;margin-top:16px;font-weight:800;letter-spacing:.04em;font-size:18px;padding:6px 12px;border:2px dashed var(--slot);border-radius:10px}
.es{font-size:30px;font-weight:700;line-height:1.2;letter-spacing:-.02em}
.hint{margin-top:14px;font-size:15px;color:var(--muted)}
.opts{display:grid;gap:10px}
.opt{min-height:56px;text-align:left;padding:12px 16px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);font-size:18px;font-weight:500}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.field{width:100%;min-height:56px;padding:12px 16px;border-radius:var(--r-md);border:1.5px solid var(--line);background:var(--surface);font-size:19px}
.field:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
textarea.field{min-height:220px;line-height:1.55;font-size:17px;resize:vertical}
.play{width:88px;height:88px;border-radius:50%;border:none;background:var(--primary);color:var(--primary-ink);font-size:32px;display:inline-flex;align-items:center;justify-content:center}
.fb{border-radius:var(--r-md);padding:16px;margin:16px 0}
.fb.ok{background:var(--ok-bg)} .fb.bad{background:var(--bad-bg)} .fb.near{background:var(--near-bg)}
.fb h3{margin-bottom:4px}
.fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)} .fb.near h3{color:var(--near)}
.fb .ans{font-weight:700}
.diff .miss{background:var(--bad-bg);color:var(--bad);border-radius:4px;padding:0 3px;font-weight:700}
.actions{display:grid;gap:10px;margin-top:6px}

/* Progreso */
.bars{display:flex;align-items:flex-end;gap:5px;height:110px;padding-top:8px}
.bars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px}
.bars .okp{background:var(--primary);border-radius:3px 3px 0 0}
.bars .badp{background:var(--bad);opacity:.7;border-radius:3px 3px 0 0}
.bars .empty{height:3px;background:var(--line);border-radius:2px}
.meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.meter>div{height:100%;background:var(--primary)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:12px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:none}
.status{font-size:13px;font-weight:700;white-space:nowrap}
.status.done{color:var(--primary)} .status.fb{color:var(--slot)}

/* Tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
#tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
#tabs button{background:none;border:none;padding:10px 0 12px;font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
#tabs button .ic{font-size:21px;line-height:1}
#tabs button[aria-current="page"]{color:var(--primary)}
#tabs.hidden{display:none}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:15px;z-index:20;max-width:90vw;text-align:center}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-width:52px;min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
pre.task{white-space:pre-wrap;font-family:var(--font);margin:0;font-size:16px}
details summary{cursor:pointer;font-weight:600}

/* v2 */
.gap{height:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;min-height:92px;display:flex;flex-direction:column;gap:4px}
.tile b{font-size:17px}.tile span{font-size:13px;color:var(--muted);line-height:1.35}
.rowbtn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:none;padding:4px 0;text-align:left;font-size:16px;min-height:44px}
.tick{color:var(--primary);font-weight:800}
.pct{font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--line);white-space:nowrap}
.pct.hi{background:var(--ok-bg);color:var(--ok)}.pct.mid{background:var(--near-bg);color:var(--near)}.pct.lo{background:var(--bad-bg);color:var(--bad)}
h3.sub{font-size:15px;color:var(--muted);margin:16px 0 8px}
.parts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.partbtn{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.partbtn span{font-size:12px;color:var(--muted)}
.page{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:18px;margin-bottom:14px;line-height:1.6}
.page h4{margin:18px 0 6px;font-size:17px}
.page p{margin:0 0 10px}
.page table,.tablewrap table{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0 14px;display:block;overflow-x:auto}
.page th,.page td,.irr th,.irr td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.page th,.irr th{font-size:13px;color:var(--muted)}
.page .ex{background:var(--primary-soft);border-radius:10px;padding:8px 12px}
.page .tip{border-left:4px solid var(--slot);padding:4px 0 4px 12px;color:var(--ink)}
.tablewrap{overflow-x:auto;margin-top:10px}
.irr{display:table!important;width:100%}
.irr tr{cursor:pointer}
.icon-btn.sm{width:36px;height:36px;font-size:14px}
.sp-prompt p{font-size:19px;line-height:1.45;margin:0 0 10px}
.timer-big{font-size:56px;font-weight:800;text-align:center;letter-spacing:-.02em;margin:10px 0;font-variant-numeric:tabular-nums}
.timer{font-weight:800;font-variant-numeric:tabular-nums;padding:6px 10px;border-radius:10px;background:var(--primary-soft);color:var(--primary)}
.timer.urgent{background:var(--bad-bg);color:var(--bad)}
.instr{font-size:15px;color:var(--muted);font-style:italic}
.passage{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;margin:12px 0;font-size:17px;line-height:1.65}
.passage p{margin:0 0 12px}
.gapn{display:inline-flex;align-items:baseline;gap:4px;font-weight:700;padding:0 6px;border-bottom:3px solid var(--slot);min-width:36px}
.gapn em{font-style:normal;color:var(--primary)}
.gapn.ok{border-color:var(--ok)}.gapn.bad,.gapn.near{border-color:var(--bad)}.gapn.bad em,.gapn.near em{color:var(--bad)}
.blocks{display:grid;gap:8px;margin:12px 0}
.block{display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.block.used{opacity:.5}
.bl{flex:none;width:28px;height:28px;border-radius:8px;background:var(--primary-soft);color:var(--primary);font-weight:800;display:flex;align-items:center;justify-content:center}
.qs{margin:14px 0}
.q{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.qn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.q.ok .qn{background:var(--ok)}.q.bad .qn,.q.near .qn{background:var(--bad)}
.qb{flex:1;min-width:0}
.qstem p{margin:0 0 8px}
.opt.sm{min-height:46px;font-size:16px;display:flex;gap:10px;align-items:flex-start}
.ol{font-weight:800;color:var(--muted)}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.letters{display:flex;flex-wrap:wrap;gap:6px}
.lt{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.lt.sel{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.lt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}.lt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.field.ok{border-color:var(--ok);background:var(--ok-bg)}.field.bad,.field.near{border-color:var(--bad);background:var(--bad-bg)}
.audio{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:8px 0}
.audio details{width:100%}
.transcript{background:var(--bg);border-radius:10px;padding:8px 12px;margin-top:6px}
.transcript p{margin:0 0 6px}
.bands{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 12px}
.bands div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.bands b{display:block;font-size:22px}.bands span{font-size:11px;color:var(--muted)}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}

/* v3 */
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}
.chips button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
.chips button[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.pv{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;margin-bottom:10px}
.pvv{font-size:20px;letter-spacing:-.01em}
.pves{color:var(--muted);margin:2px 0 8px}
.exs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.exs li{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.45}
.exs li span{padding-top:6px}
.hl{background:var(--near-bg);color:var(--ink);padding:0 3px;border-radius:4px}
.chip.alt{background:var(--near-bg);color:var(--near)}
.row .chip{margin-left:4px}
.switch{width:52px;height:30px;border-radius:999px;border:none;background:var(--line);position:relative;flex:none}
.switch span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"] span{left:25px}
.packbox{background:var(--bg);border-radius:10px;padding:8px 12px;margin-top:8px}
.packbox ul,.preview ul{margin:4px 0 8px;padding-left:18px}
.pv-entry{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
pre.tpl{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--bg);border-radius:10px;padding:10px;margin:8px 0 0}
.page .model{background:var(--bg);border-left:4px solid var(--primary);border-radius:0 10px 10px 0;padding:12px 14px;font-size:16px}
.page td b{white-space:nowrap}
.langbtn{margin-left:10px;min-width:44px;height:32px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:13px;color:var(--primary)}
.seg button[data-lang]{min-width:100px}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<div id="tabs"><nav aria-label="Sections">
  <button data-go="home" data-tl="Home|Inicio"><span class="ic" aria-hidden="true">◉</span>Home</button>
  <button data-go="study" data-tl="Study|Estudiar"><span class="ic" aria-hidden="true">❏</span>Study</button>
  <button data-go="tests" data-tl="Tests|Tests"><span class="ic" aria-hidden="true">✓</span>Tests</button>
  <button data-go="writing" data-tl="Write|Escribir"><span class="ic" aria-hidden="true">✎</span>Write</button>
  <button data-go="data" data-tl="Data|Datos"><span class="ic" aria-hidden="true">⇅</span>Data</button>
</nav></div>
<script src="content.js"></script>
<script src="grammar.js"></script>
<script src="guides.js"></script>
<script src="exams.js"></script>
<script src="phrasal.js"></script>
<script src="writing.js"></script>
<script src="content_en.js"></script>
<script src="app.js"></script>
</body>
</html>
